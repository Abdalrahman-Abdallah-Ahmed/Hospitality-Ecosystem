name: Deploy

on:
  push:
    branches: [main]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /var/www/api-hospitality

            git pull origin main

            chmod -R ug+rwX storage bootstrap/cache

            # --no-dev: test and debugging tooling has no place on the server.
            composer install --no-dev --optimize-autoloader --no-interaction

            # --force: in production, migrate asks for confirmation and, with
            # no terminal to answer it, cancels instead of migrating.
            php artisan migrate --force

            php artisan optimize

            php artisan queue:restart
