name: Deploy

on:
  push:
    branches: [main]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /var/www/api-hospitality

            git pull origin main

            # The web server (PHP-FPM) writes compiled views, cache and logs
            # under storage/ and bootstrap/cache, so it owns those files and
            # ec2-user cannot chmod them. Hand them to ec2-user with the web
            # server's group (read from storage/ itself), group-writable, and
            # make new files inherit that group, so both the deploy (artisan
            # optimize) and the app can write there.
            WEB_GROUP="$(stat -c '%G' storage)"
            sudo chown -R "ec2-user:${WEB_GROUP}" storage bootstrap/cache
            sudo chmod -R ug+rwX storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod g+s {} +

            # --no-dev: test and debugging tooling has no place on the server.
            composer install --no-dev --optimize-autoloader --no-interaction

            # --force: in production, migrate asks for confirmation and, with
            # no terminal to answer it, cancels instead of migrating.
            php artisan migrate --force

            php artisan optimize

            php artisan queue:restart

      # The new version must answer the full health check (database, queue,
      # cache) from outside. If it does not within ~25 s, the deploy is marked
      # failed and GitHub emails the owner. Nothing is rolled back: fix
      # forward or revert (spec 017 FR-025; atomic releases are post-MVP).
      - name: Health check
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS -o /dev/null -H "X-Health-Token: ${HEALTH_CHECK_TOKEN}" "${API_HEALTH_URL}"; then
              echo "Healthy after attempt ${attempt}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed API did not pass its health check."
          exit 1
